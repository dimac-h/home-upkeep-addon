# Disposable Home Assistant instance for local panel development.
#
#   docker compose -f dev/docker-compose.yml up -d     # start
#   docker compose -f dev/docker-compose.yml logs -f   # watch logs
#   docker compose -f dev/docker-compose.yml down       # stop
#   rm -rf dev/config                                   # full reset
#
# Url: http://localhost:8123
services:
  homeassistant:
    container_name: home-upkeep-hass
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      # Load the Home Upkeep custom integration (built panel bundle lives at
      # custom_components/home_upkeep/frontend/dist, served by panel.py).
      - ../custom_components:/config/custom_components:ro
    environment:
      - TZ=Europe/Amsterdam
