# Disposable Home Assistant instance for local panel development.
#
#   docker compose -f dev/docker-compose.yml up -d     # start
#   docker compose -f dev/docker-compose.yml logs -f   # watch logs
#   docker compose -f dev/docker-compose.yml down       # stop
#   rm -rf dev/config                                   # full reset
#
# Url: http://localhost:8123
services:
  homeassistant:
    container_name: home-upkeep-hass
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      # Serve the built panel bundle straight from the frontend build output.
      # HA exposes /config/www/** at the URL /local/**.
      - ../home-upkeep/frontend/dist:/config/www/home-upkeep:ro
    environment:
      - TZ=Europe/Amsterdam
